# Test-only configuration. No real secrets; no connection is opened unless a test touches the database.
spring.data.mongodb.uri=mongodb://localhost:27017/harvesthub_test
spring.data.mongodb.database=harvesthub_test
spring.data.mongodb.auto-index-creation=false
jwt.secret=test-only-secret-not-used-anywhere-else-0123456789
jwt.expiration-ms=60000
spring.mail.host=localhost
harvesthub.seed-demo-data=false
harvesthub.upload-dir=target/test-uploads

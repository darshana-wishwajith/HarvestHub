spring.data.mongodb.uri=mongodb+srv://<user>:<password>@harvesthubdbcluster.pwozoql.mongodb.net/
spring.data.mongodb.database=harvesthub_db

# JWT Settings
# This is a secure, randomly generated key for local development.
# For production, it's still recommended to override this with an environment variable.
jwt.secret=${JWT_SECRET}

# JWT token expiration in milliseconds (7 days)
jwt.expiration-ms=604800000

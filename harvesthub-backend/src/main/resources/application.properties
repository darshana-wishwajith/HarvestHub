# HarvestHub backend configuration.
# NO SECRETS IN THIS FILE. Real values come from environment variables
# (production: systemd Environment=..., see application-local.properties.example)
# or, for local development, from an untracked ./application-local.properties.
spring.config.import=optional:file:./application-local.properties

# --- MongoDB (defaults to a local instance) ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/harvesthub}
spring.data.mongodb.database=${MONGODB_DATABASE:harvesthub}
spring.data.mongodb.auto-index-creation=true

# --- JWT (secret is required; at least 32 bytes) ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Email (password reset / OTP) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Google Maps (optional; distance falls back to GPS straight-line) ---
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# --- Uploads ---
harvesthub.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# --- Demo seed data (creates demo accounts only when enabled) ---
harvesthub.seed-demo-data=${SEED_DEMO_DATA:false}
harvesthub.demo-password=${DEMO_PASSWORD:}

# Never leak stack traces / internal messages to clients
server.error.include-stacktrace=never
server.error.include-message=never

plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.harvesthub.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.harvesthub.mobile"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // Google Maps SDK key: put MAPS_API_KEY=... in local.properties (untracked) or pass -PmapsApiKey=...
        def localProps = new Properties()
        def lp = rootProject.file('local.properties')
        if (lp.exists()) lp.withInputStream { localProps.load(it) }
        manifestPlaceholders = [mapsApiKey: project.findProperty('mapsApiKey') ?: localProps.getProperty('MAPS_API_KEY', '')]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        debug {
            // Backend for debug builds, first match wins:
            //   1. -PapiUrl=http://<laptop-ip>:8080/  (scripts/run-mobile.ps1 passes the laptop's Wi-Fi IP)
            //   2. API_URL=... in local.properties (untracked; used by Android Studio's Run button)
            //   3. production https://harvesthubapp.tech/
            def debugProps = new Properties()
            def debugLp = rootProject.file('local.properties')
            if (debugLp.exists()) debugLp.withInputStream { debugProps.load(it) }
            def apiUrl = project.findProperty('apiUrl') ?: debugProps.getProperty('API_URL', 'https://harvesthubapp.tech/')
            if (!apiUrl.endsWith('/')) apiUrl += '/'
            buildConfigField 'String', 'API_BASE_URL', "\"${apiUrl}\""
        }
        release {
            buildConfigField 'String', 'API_BASE_URL', '"https://harvesthubapp.tech/"'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    // OpenStreetMap map view (free, no API key) - replaces the Google Maps SDK screen by screen
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // CameraX dependencies
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"
    // in-app 10-second listing video (guided camera step 3)
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation 'androidx.exifinterface:exifinterface:1.3.6'   // upright photo thumbnails on Listing Details
    implementation 'com.github.bumptech.glide:glide:4.16.0'        // listing photos from the server (/uploads/...)
    implementation 'androidx.viewpager2:viewpager2:1.0.0'          // full-screen media viewer
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)

    }

}
